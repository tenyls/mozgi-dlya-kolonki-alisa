<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </radialGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="0.45" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="brain" gradientUnits="userSpaceOnUse" cx="480" cy="360" r="230">
      <stop offset="0" stop-color="#FFE4F1"/>
      <stop offset="0.6" stop-color="#F9A8D4"/>
      <stop offset="1" stop-color="#EC4899"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" x2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="fabric" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2.6" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <!-- фон -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="190" cy="230" r="5"/><circle cx="830" cy="190" r="4"/><circle cx="870" cy="560" r="5"/>
    <circle cx="150" cy="620" r="4"/><circle cx="260" cy="860" r="3"/><circle cx="790" cy="860" r="4"/>
  </g>

  <!-- свечение под колонкой -->
  <ellipse cx="512" cy="860" rx="250" ry="40" fill="#000" opacity="0.35" filter="url(#glow)"/>

  <!-- корпус колонки -->
  <path d="M312 520 L312 800 Q312 860 512 860 Q712 860 712 800 L712 520 Z" fill="url(#body)"/>
  <path d="M312 520 L312 800 Q312 860 512 860 Q712 860 712 800 L712 520 Z" fill="url(#fabric)"/>
  <!-- светящееся кольцо сверху -->
  <ellipse cx="512" cy="520" rx="200" ry="52" fill="#0F172A"/>
  <ellipse cx="512" cy="520" rx="200" ry="52" fill="none" stroke="url(#ring)" stroke-width="16"/>
  <ellipse cx="512" cy="520" rx="200" ry="52" fill="none" stroke="url(#ring)" stroke-width="22" opacity="0.6" filter="url(#glow)"/>

  <!-- мозг, торчащий из колонки -->
  <g>
    <g fill="url(#brain)" stroke="#BE185D" stroke-width="10" stroke-linejoin="round">
      <circle cx="420" cy="440" r="78"/>
      <circle cx="510" cy="390" r="92"/>
      <circle cx="606" cy="436" r="80"/>
      <circle cx="455" cy="500" r="64"/>
      <circle cx="565" cy="500" r="64"/>
    </g>
    <!-- заливка без внутренних обводок -->
    <g fill="url(#brain)">
      <circle cx="420" cy="440" r="70"/>
      <circle cx="510" cy="392" r="84"/>
      <circle cx="606" cy="436" r="72"/>
      <circle cx="455" cy="498" r="56"/>
      <circle cx="565" cy="498" r="56"/>
      <rect x="420" y="420" width="190" height="90"/>
    </g>
    <!-- извилины -->
    <g fill="none" stroke="#DB2777" stroke-width="9" stroke-linecap="round">
      <path d="M510 318 Q490 360 512 400 Q534 440 510 520"/>
      <path d="M392 420 Q420 400 446 428 Q470 452 450 480"/>
      <path d="M630 410 Q600 396 584 426 Q570 456 598 476"/>
      <path d="M455 350 Q470 372 458 392"/>
      <path d="M562 344 Q548 370 566 392"/>
    </g>
    <!-- блик -->
    <ellipse cx="478" cy="346" rx="34" ry="16" fill="#FFFFFF" opacity="0.7" transform="rotate(-20 478 346)"/>
  </g>

  <!-- отвёртка, воткнутая в мозг -->
  <g transform="rotate(38 690 300)">
    <rect x="676" y="250" width="20" height="150" rx="6" fill="url(#steel)"/>
    <path d="M676 398 L696 398 L690 422 L682 422 Z" fill="#CBD5E1"/>
    <rect x="660" y="120" width="52" height="140" rx="22" fill="url(#handle)" stroke="#B45309" stroke-width="6"/>
    <rect x="672" y="140" width="8" height="100" rx="4" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- смешное лицо на колонке -->
  <g>
    <circle cx="448" cy="650" r="46" fill="#FFFFFF"/>
    <circle cx="576" cy="650" r="46" fill="#FFFFFF"/>
    <circle cx="462" cy="662" r="21" fill="#111827"/>
    <circle cx="562" cy="640" r="21" fill="#111827"/>
    <circle cx="470" cy="655" r="7" fill="#FFFFFF"/>
    <circle cx="570" cy="633" r="7" fill="#FFFFFF"/>
    <path d="M452 742 Q512 792 572 742" fill="none" stroke="#F9A8D4" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- искры «озарения» -->
  <g fill="#FDE047">
    <path d="M300 300 L312 336 L348 348 L312 360 L300 396 L288 360 L252 348 L288 336 Z"/>
    <path d="M770 430 L778 452 L800 460 L778 468 L770 490 L762 468 L740 460 L762 452 Z"/>
    <path d="M250 520 L256 536 L272 542 L256 548 L250 564 L244 548 L228 542 L244 536 Z" opacity="0.8"/>
  </g>
</svg>
